name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Tests run without a GPU; the heavy ML stack (torch, NeMo) is not needed.
      - run: python -m pip install pytest jiwer numpy pandas
      - run: python -m pytest -q
